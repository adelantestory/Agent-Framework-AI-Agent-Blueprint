<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Dashboard - Adelante Story</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f5f5f5;
            color: #32373c;
            padding: 20px;
        }

        .header {
            background: linear-gradient(135deg, #40ABCD 0%, #32373c 100%);
            color: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 6px 6px 9px rgba(0, 0, 0, 0.2);
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .refresh-indicator {
            display: inline-block;
            padding: 5px 15px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            font-size: 12px;
            margin-top: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 6px 6px 9px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            font-size: 18px;
            color: #40ABCD;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .metric {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .metric:last-child {
            border-bottom: none;
        }

        .metric-label {
            color: #666;
            font-size: 14px;
        }

        .metric-value {
            font-weight: 600;
            font-size: 16px;
            color: #32373c;
        }

        .metric-value.highlight {
            color: #f3b626;
            font-size: 24px;
        }

        .chart-container {
            position: relative;
            height: 250px;
            margin-top: 15px;
        }

        .tool-list {
            list-style: none;
        }

        .tool-item {
            padding: 10px;
            margin: 8px 0;
            background: #f9f9f9;
            border-left: 4px solid #40ABCD;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tool-name {
            font-weight: 500;
            color: #32373c;
        }

        .tool-stats {
            display: flex;
            gap: 15px;
            font-size: 12px;
            color: #666;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            background: #f3b626;
            color: white;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge.success {
            background: #28a745;
        }

        .badge.error {
            background: #dc3545;
        }

        .error-list {
            max-height: 200px;
            overflow-y: auto;
        }

        .error-item {
            padding: 10px;
            margin: 8px 0;
            background: #fff3cd;
            border-left: 4px solid #dc3545;
            border-radius: 4px;
            font-size: 12px;
        }

        .timestamp {
            color: #999;
            font-size: 11px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .wide-card {
            grid-column: 1 / -1;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .refreshing {
            animation: pulse 1s infinite;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 Analytics Dashboard</h1>
        <p>Adelante Story Foundation - Real-time Agent Metrics</p>
        <div class="refresh-indicator" id="refresh-indicator">
            Auto-refreshing every 5 seconds
        </div>
    </div>

    <div id="dashboard-content" class="loading">
        Loading analytics...
    </div>

    <script>
        let toolUsageChart = null;
        let tokenChart = null;

        async function fetchAnalytics() {
            try {
                const indicator = document.getElementById('refresh-indicator');
                indicator.classList.add('refreshing');

                const response = await fetch('/api/analytics');
                const data = await response.json();

                renderDashboard(data);

                indicator.classList.remove('refreshing');
            } catch (error) {
                console.error('Failed to fetch analytics:', error);
                document.getElementById('dashboard-content').innerHTML =
                    '<div class="card"><p style="color: red;">Error loading analytics</p></div>';
            }
        }

        function renderDashboard(data) {
            const content = document.getElementById('dashboard-content');

            const html = `
                <div class="grid">
                    <!-- Summary Card -->
                    <div class="card">
                        <h2>📈 Summary</h2>
                        <div class="metric">
                            <span class="metric-label">Total Events</span>
                            <span class="metric-value highlight">${data.total_events}</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Session Started</span>
                            <span class="metric-value">${new Date(data.session_start).toLocaleString()}</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Uptime</span>
                            <span class="metric-value">${calculateUptime(data.session_start)}</span>
                        </div>
                    </div>

                    <!-- LLM Metrics Card -->
                    <div class="card">
                        <h2>🤖 LLM Metrics</h2>
                        <div class="metric">
                            <span class="metric-label">Total Calls</span>
                            <span class="metric-value">${data.llm_metrics.total_calls}</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Total Tokens</span>
                            <span class="metric-value">${data.llm_metrics.total_tokens.toLocaleString()}</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Avg Tokens/Call</span>
                            <span class="metric-value">${data.llm_metrics.avg_tokens_per_call.toFixed(0)}</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Est. Cost</span>
                            <span class="metric-value">$${estimateCost(data.llm_metrics).toFixed(4)}</span>
                        </div>
                    </div>

                    <!-- Errors Card -->
                    <div class="card">
                        <h2>⚠️ Errors</h2>
                        <div class="metric">
                            <span class="metric-label">Total Errors</span>
                            <span class="metric-value ${data.error_count > 0 ? 'badge error' : 'badge success'}">
                                ${data.error_count}
                            </span>
                        </div>
                        ${data.error_count > 0 ? `
                            <div class="error-list">
                                ${data.recent_errors.map(err => `
                                    <div class="error-item">
                                        <div>${err.message}</div>
                                        <div class="timestamp">${new Date(err.timestamp).toLocaleString()}</div>
                                    </div>
                                `).join('')}
                            </div>
                        ` : '<p style="color: #28a745; margin-top: 10px;">✓ No errors</p>'}
                    </div>
                </div>

                <!-- Tool Usage Card (Wide) -->
                <div class="grid">
                    <div class="card wide-card">
                        <h2>🔧 Tool Usage</h2>
                        <ul class="tool-list">
                            ${Object.entries(data.tool_usage_count).map(([tool, count]) => {
                                const perf = data.tool_performance[tool];
                                return `
                                    <li class="tool-item">
                                        <span class="tool-name">${tool}</span>
                                        <div class="tool-stats">
                                            <span><strong>${count}</strong> calls</span>
                                            ${perf ? `
                                                <span>Avg: <strong>${perf.avg_ms.toFixed(0)}ms</strong></span>
                                                <span>Min: ${perf.min_ms}ms</span>
                                                <span>Max: ${perf.max_ms}ms</span>
                                            ` : ''}
                                        </div>
                                    </li>
                                `;
                            }).join('') || '<li style="color: #999;">No tools used yet</li>'}
                        </ul>
                    </div>
                </div>

                <!-- Charts -->
                <div class="grid">
                    <div class="card">
                        <h2>📊 Tool Usage Distribution</h2>
                        <div class="chart-container">
                            <canvas id="toolUsageChart"></canvas>
                        </div>
                    </div>

                    <div class="card">
                        <h2>🎯 Token Distribution</h2>
                        <div class="chart-container">
                            <canvas id="tokenChart"></canvas>
                        </div>
                    </div>
                </div>

                <!-- Event Types Card -->
                <div class="grid">
                    <div class="card wide-card">
                        <h2>📋 Event Types</h2>
                        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 10px;">
                            ${Object.entries(data.events_by_type).map(([type, count]) => `
                                <div style="background: #f9f9f9; padding: 12px; border-radius: 8px; text-align: center;">
                                    <div style="font-size: 24px; font-weight: 600; color: #40ABCD;">${count}</div>
                                    <div style="font-size: 12px; color: #666; margin-top: 5px;">${type}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;

            content.innerHTML = html;

            // Render charts
            renderToolUsageChart(data.tool_usage_count);
            renderTokenChart(data.llm_metrics);
        }

        function renderToolUsageChart(toolUsage) {
            const ctx = document.getElementById('toolUsageChart');
            if (!ctx) return;

            if (toolUsageChart) {
                toolUsageChart.destroy();
            }

            const labels = Object.keys(toolUsage);
            const values = Object.values(toolUsage);

            toolUsageChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: values,
                        backgroundColor: [
                            '#40ABCD',
                            '#f3b626',
                            '#32373c',
                            '#28a745',
                            '#dc3545'
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    }
                }
            });
        }

        function renderTokenChart(llmMetrics) {
            const ctx = document.getElementById('tokenChart');
            if (!ctx) return;

            if (tokenChart) {
                tokenChart.destroy();
            }

            tokenChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Prompt', 'Completion', 'Total'],
                    datasets: [{
                        label: 'Tokens',
                        data: [
                            llmMetrics.total_prompt_tokens,
                            llmMetrics.total_completion_tokens,
                            llmMetrics.total_tokens
                        ],
                        backgroundColor: ['#40ABCD', '#f3b626', '#32373c']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }

        function calculateUptime(sessionStart) {
            const start = new Date(sessionStart);
            const now = new Date();
            const diff = now - start;

            const hours = Math.floor(diff / 3600000);
            const minutes = Math.floor((diff % 3600000) / 60000);
            const seconds = Math.floor((diff % 60000) / 1000);

            if (hours > 0) {
                return `${hours}h ${minutes}m`;
            } else if (minutes > 0) {
                return `${minutes}m ${seconds}s`;
            } else {
                return `${seconds}s`;
            }
        }

        function estimateCost(llmMetrics) {
            // GPT-4o pricing (example rates - adjust to your actual rates)
            const PROMPT_COST_PER_1K = 0.005;
            const COMPLETION_COST_PER_1K = 0.015;

            const promptCost = (llmMetrics.total_prompt_tokens / 1000) * PROMPT_COST_PER_1K;
            const completionCost = (llmMetrics.total_completion_tokens / 1000) * COMPLETION_COST_PER_1K;

            return promptCost + completionCost;
        }

        // Initial load
        fetchAnalytics();

        // Auto-refresh every 5 seconds
        setInterval(fetchAnalytics, 5000);
    </script>
</body>
</html>
